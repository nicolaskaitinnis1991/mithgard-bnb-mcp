name: Bug report
description: Something doesn't work as expected
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

  - type: input
    id: version
    attributes:
      label: Version
      description: Which release/tag are you running? (e.g. `v0.1.0-alpha`, or commit SHA)
      placeholder: v0.1.0-alpha
    validations:
      required: true

  - type: input
    id: node_version
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: v20.11.0
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Tool involved
      description: Which of the 9 MCP tools is involved?
      options:
        - airbnb_search
        - airbnb_listing_details
        - host_insights
        - guest_message_assistant
        - booking_request_triage
        - smart_pricing
        - calendar_optimizer
        - review_responder
        - turnover_coordinator
        - other / not tool-specific
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What did you observe?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, repeatable set of steps.
      value: |
        ```
        1. ...
        2. ...
        3. ...
        ```
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant stderr log lines (the server logs JSON to fd 2).
      render: shell

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I checked CHANGELOG.md for known issues in my version
          required: true
        - label: I have redacted any personally identifiable information (PII) from logs and reproduction steps
          required: true
