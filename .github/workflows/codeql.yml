name: CodeQL
on:
  push: { branches: [main] }
  schedule: [{ cron: '0 4 * * 1' }]
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read # required by codeql-action for workflow-run telemetry (fixes "Resource not accessible by integration")
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
