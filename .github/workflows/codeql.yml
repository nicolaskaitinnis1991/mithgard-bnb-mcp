name: CodeQL
on:
  push: { branches: [main] }
  schedule: [{ cron: '0 4 * * 1' }]
jobs:
  analyze:
    # Code Scanning upload requires GitHub Advanced Security on private repos
    # (paid feature). On public repos it's free. Skip cleanly on private to keep
    # CI status green; auto-activates the moment the repo flips to public.
    if: ${{ github.event.repository.private == false || github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read # required by codeql-action for workflow-run telemetry (fixes "Resource not accessible by integration")
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
